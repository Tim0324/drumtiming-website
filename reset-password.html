<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passwort zurücksetzen — RhythmLab</title>
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
  :root{
    --bg:#15161a; --card:#1f2127; --border:#2a2d34; --text:#f1f0ec;
    --text-muted:#93959d; --teal:#00c9a0; --teal-dim:#00aa88; --red:#ff5c5c;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--text); font-family:"Inter",sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:28px; padding:24px;
  }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    max-width:420px; width:100%; padding:40px 32px;
  }
  h1{ font-family:"Space Grotesk",sans-serif; font-size:22px; margin-bottom:8px; text-align:center; }
  p.sub{ color:var(--text-muted); font-size:14px; margin-bottom:24px; text-align:center; }
  label{ display:block; font-size:13px; color:var(--text-muted); margin-bottom:6px; }
  .field{ margin-bottom:16px; }
  input[type="password"]{
    width:100%; background:#1b1d22; border:1px solid var(--border);
    border-radius:9px; padding:12px 13px; color:var(--text); font-size:14.5px;
  }
  input:focus{ outline:none; border-color:var(--teal-dim); }
  button{
    width:100%; margin-top:8px; padding:13px; border:none; border-radius:10px;
    background:var(--teal-dim); color:#08120f; font-weight:600; font-size:14.5px;
    cursor:pointer;
  }
  button:hover{ background:var(--teal); }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  .status{ margin-top:16px; font-size:13.5px; text-align:center; }
  .status.err{ color:var(--red); }
  .status.ok{ color:var(--teal); }
  footer{
    max-width:680px; display:flex; justify-content:center; gap:18px;
    flex-wrap:wrap; font-size:13px;
  }
  footer a{ color:var(--text-muted); text-decoration:none; }
  footer a:hover{ color:var(--text); }
</style>
</head>
<body>
  <div class="card">
    <h1>Neues Passwort setzen</h1>
    <p class="sub" id="sub-text">Bitte gib dein neues Passwort ein.</p>

    <form id="reset-form">
      <div class="field">
        <label for="pw1">Neues Passwort</label>
        <input type="password" id="pw1" minlength="8" required>
      </div>
      <div class="field">
        <label for="pw2">Passwort bestätigen</label>
        <input type="password" id="pw2" minlength="8" required>
      </div>
      <button type="submit" id="submit-btn">Passwort speichern</button>
    </form>

    <div class="status" id="status"></div>
  </div>
<footer>
  <div class="wrap">
    <div class="brand"><span class="mark" style="width:8px;height:8px;"></span>RhythmLab</div>
    <div class="legal">
      <a href="/impressum.html">Impressum</a>
      <a href="/datenschutz.html">Datenschutz</a>
      <a href="/agb.html">AGB</a>
      <a href="/widerruf.html">Widerrufsbelehrung</a>
      <a href="/kuendigen.html">Verträge hier kündigen</a>
      <a href="mailto:info@drumtiming.com">Kontakt</a>
    </div>
  </div>
</footer>

<script>
  // Bei einer echten Domain anpassen (dieselbe Basis-URL wie
  // config.API_BASE_URL im Backend).
  const _isLocal = ["localhost", "127.0.0.1", ""].includes(location.hostname);
  const API_BASE_URL = _isLocal
  ? "http://127.0.0.1:8000"
  : "https://api.drumtiming.com";

  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  const form = document.getElementById("reset-form");
  const statusEl = document.getElementById("status");
  const submitBtn = document.getElementById("submit-btn");
  const subText = document.getElementById("sub-text");

  if(!token){
    form.style.display = "none";
    subText.textContent = "";
    statusEl.textContent = "Dieser Link ist ungültig — es fehlt der Reset-Token. Bitte fordere einen neuen Link in der App an.";
    statusEl.className = "status err";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    statusEl.textContent = "";
    statusEl.className = "status";

    const pw1 = document.getElementById("pw1").value;
    const pw2 = document.getElementById("pw2").value;

    if(pw1 !== pw2){
      statusEl.textContent = "Die Passwörter stimmen nicht überein.";
      statusEl.className = "status err";
      return;
    }
    if(pw1.length < 8){
      statusEl.textContent = "Das Passwort muss mindestens 8 Zeichen lang sein.";
      statusEl.className = "status err";
      return;
    }

    submitBtn.disabled = true;

    try {
      const res = await fetch(`${API_BASE_URL}/auth/reset-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, new_password: pw1 })
      });

      if(res.status === 204){
        form.style.display = "none";
        statusEl.textContent = "Dein Passwort wurde geändert. Du kannst dich jetzt in der App neu einloggen.";
        statusEl.className = "status ok";
      } else {
        let msg = "Der Link ist ungültig oder abgelaufen. Bitte fordere einen neuen an.";
        try {
          const data = await res.json();
          if(data.detail) msg = data.detail;
        } catch(_) {}
        statusEl.textContent = msg;
        statusEl.className = "status err";
        submitBtn.disabled = false;
      }
    } catch(err){
      statusEl.textContent = "Netzwerkfehler — bitte später erneut versuchen.";
      statusEl.className = "status err";
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>

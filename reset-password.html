/* RhythmLab Windows 11 unified design — all resources remain local. */
:root{
  --rl-blue:#0877ff;
  --rl-blue-deep:#0565dc;
  --rl-blue-soft:#42a5ff;
  --rl-ink:#07182d;
  --rl-text:#253e59;
  --rl-muted:#60758c;
  --rl-sky:#eaf7ff;
  --rl-card:rgba(255,255,255,.88);
  --rl-card-solid:#fff;
  --rl-line:#cce6f8;
  --rl-line-strong:#b4d9f3;
  --rl-green:#19a971;
  --rl-red:#dd4052;
  --rl-shadow:0 28px 80px rgba(23,82,132,.14),0 5px 20px rgba(23,82,132,.07);
  --rl-shadow-soft:0 16px 46px rgba(23,82,132,.10),0 2px 8px rgba(23,82,132,.05);
  --rl-radius-xl:32px;
  --rl-radius-lg:24px;

}

html{scroll-behavior:smooth}
body.rl-secondary{
  min-height:100vh !important;
  margin:0 !important;
  padding:0 !important;
  display:flex !important;
  flex-direction:column !important;

  justify-content:flex-start !important;

  font-family:var(--rl-font) !important;

    radial-gradient(circle at 8% -5%,rgba(66,165,255,.30),transparent 34rem),
    radial-gradient(circle at 96% 16%,rgba(8,119,255,.13),transparent 31rem),
    linear-gradient(180deg,#f7fcff 0%,var(--rl-sky) 48%,#f9fcff 100%) !important;
  background-attachment:fixed !important;
  -webkit-font-smoothing:antialiased;
}
body.rl-secondary::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  opacity:.48;
  background-image:
    linear-gradient(rgba(255,255,255,.38) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.38) 1px,transparent 1px);
  background-size:38px 38px;
  mask-image:linear-gradient(to bottom,#000,transparent 68%);
}
body.rl-secondary *,body.rl-secondary *::before,body.rl-secondary *::after{box-sizing:border-box}
body.rl-secondary .wrap{width:min(1180px,calc(100% - 48px)) !important;margin-inline:auto !important;padding:0 !important}

/* Shared Windows 11 navigation */

}
body.rl-secondary nav.top.rl-site-nav .wrap{

  align-items:center !important;
  justify-content:space-between !important;
  gap:28px !important;
}
body.rl-secondary .brand{

body.rl-secondary .confirmation,
body.rl-secondary .form,
body.rl-secondary .key-card,

  box-shadow:var(--rl-shadow-soft) !important;
}
body.rl-secondary .card,
body.rl-secondary .block,
body.rl-secondary .withdraw-card,
body.rl-secondary .confirmation,

<body class="rl-win11 rl-secondary rl-compact rl-form-page">
<nav class="nav" aria-label="Hauptnavigation">
  <a class="brand" href="index.html" aria-label="RhythmLab Startseite">
    <span class="mark" aria-hidden="true"></span>
    <span>Rhythm<span class="brand-accent">Lab</span></span>
  </a>
  <span class="nav-current" aria-live="polite">Passwort zurücksetzen</span>
  <div class="navlinks">
    <a href="index.html#ablauf">Lernablauf</a>
    <a href="index.html#lehrer">Für Lehrer</a>
    <a href="index.html#loesung">Funktionen</a>
    <a href="index.html#preis">Preis</a>

  </div>

    <a class="nav-download" href="index.html#download">Download</a>
  </div>
</nav>

  <div class="card">
    <h1>Neues Passwort setzen</h1>
    <p class="sub" id="sub-text">Bitte gib dein neues Passwort ein.</p>

    <form id="reset-form">
      <div class="field">
        <label for="pw1">Neues Passwort</label>
        <input type="password" id="pw1" minlength="8" required>
      </div>
      <div class="field">
        <label for="pw2">Passwort bestätigen</label>
        <input type="password" id="pw2" minlength="8" required>
      </div>
      <button type="submit" id="submit-btn">Passwort speichern</button>
    </form>

    <div class="status" id="status"></div>
  </div>
<footer class="rl-site-footer">
  <div class="wrap">
    <a class="brand footer-brand" href="index.html" aria-label="RhythmLab Startseite">
      <span class="mark" aria-hidden="true"></span>
      <span>Rhythm<span class="brand-accent">Lab</span></span>
    </a>
    <div class="legal">
      <a href="impressum.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
      <a href="agb.html">AGB</a>
      <a href="widerruf.html">Widerrufsbelehrung</a>
      <a href="kuendigen.html">Verträge kündigen</a>
      <a href="mailto:info@drumtiming.com">Kontakt</a>
    </div>
  </div>
</footer>
<script>
  // Bei einer echten Domain anpassen (dieselbe Basis-URL wie
  // config.API_BASE_URL im Backend).
  const _isLocal = ["localhost", "127.0.0.1", ""].includes(location.hostname);
  const API_BASE_URL = _isLocal
  ? "http://127.0.0.1:8000"
  : "https://api.drumtiming.com";

  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  const form = document.getElementById("reset-form");
  const statusEl = document.getElementById("status");
  const submitBtn = document.getElementById("submit-btn");
  const subText = document.getElementById("sub-text");

  if(!token){
    form.style.display = "none";
    subText.textContent = "";
    statusEl.textContent = "Dieser Link ist ungültig — es fehlt der Reset-Token. Bitte fordere einen neuen Link in der App an.";
    statusEl.className = "status err";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    statusEl.textContent = "";
    statusEl.className = "status";

    const pw1 = document.getElementById("pw1").value;
    const pw2 = document.getElementById("pw2").value;

    if(pw1 !== pw2){
      statusEl.textContent = "Die Passwörter stimmen nicht überein.";
      statusEl.className = "status err";
      return;
    }
    if(pw1.length < 8){
      statusEl.textContent = "Das Passwort muss mindestens 8 Zeichen lang sein.";
      statusEl.className = "status err";
      return;
    }

    submitBtn.disabled = true;

    try {
      const res = await fetch(`${API_BASE_URL}/auth/reset-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, new_password: pw1 })
      });

      if(res.status === 204){
        form.style.display = "none";
        statusEl.textContent = "Dein Passwort wurde geändert. Du kannst dich jetzt in der App neu einloggen.";
        statusEl.className = "status ok";
      } else {
        let msg = "Der Link ist ungültig oder abgelaufen. Bitte fordere einen neuen an.";
        try {
          const data = await res.json();
          if(data.detail) msg = data.detail;
        } catch(_) {}
        statusEl.textContent = msg;
        statusEl.className = "status err";
        submitBtn.disabled = false;
      }
    } catch(err){
      statusEl.textContent = "Netzwerkfehler — bitte später erneut versuchen.";
      statusEl.className = "status err";
      submitBtn.disabled = false;
    }
  });
</script>
</body>
